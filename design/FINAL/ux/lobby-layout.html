<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Flash Golf lobby layout check</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#241b33;--paper:#fff8e7;--paper-sh:#e9dcc0;--grass:#6ad636;--mint:#44d67a;--mint-sh:#2aa85a;--sun:#ffd93b;--p1:#ff5d73;--p2:#50b7ff;--p2-sh:#2f8fd6;--bad:#e23b4f;
    --font:"Fredoka","Arial Rounded MT Bold","Arial Black",sans-serif}
  html,body{height:100%;margin:0;font-family:var(--font);color:var(--ink)}
  /* Lobby is a VIEWPORT-space screen (CSS px), not stage-scaled: it scrolls when the keyboard appears. */
  body{background:linear-gradient(#3fb6ff,#c9f1ff 70%,#6ad636 70.5%);overflow:auto}
  .screen{min-height:100%;box-sizing:border-box;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px}
  .top{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center}
  .back{height:44px;padding:0 14px;border-radius:12px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:700 16px var(--font)}
  .you{height:36px;display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:0 12px;font:700 15px var(--font)}
  .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:var(--p1)} .dot.blue{background:var(--p2)}
  .card{width:100%;max-width:640px;box-sizing:border-box;background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  h1{margin:0;font-size:32px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
  .lab{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
  .code{font-size:56px;font-weight:700;letter-spacing:.22em;line-height:1;text-align:center;padding:12px 0;border:4px solid var(--ink);border-radius:14px;background:#fff;user-select:all}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{flex:1 1 150px;height:52px;border-radius:14px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);background:var(--paper);font:700 18px var(--font);color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--mint);color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;font-size:20px}
  .btn.primary:disabled{background:var(--paper-sh);color:#8d8372;-webkit-text-stroke:0;box-shadow:0 5px 0 #8d8372}
  .btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;flex:0 0 auto}
  .status{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
  .status i{width:12px;height:12px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(68,214,122,.3)}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:3px solid var(--ink);border-radius:999px;background:#fff;font:700 16px var(--font)}
  .holes{display:flex;gap:8px;flex-wrap:wrap}
  .hole{flex:1 1 110px;height:44px;border-radius:12px;border:3px solid var(--ink);background:#fff;font:700 16px var(--font)}
  .hole.on{background:var(--sun);box-shadow:inset 0 -5px 0 #e0a800}
  .start{display:flex;align-items:center;gap:12px}
  .cap{font-size:15px;font-weight:600;opacity:.75}
  .foot{font-size:15px;opacity:.75;text-align:center}
  .note{position:fixed;left:8px;top:8px;background:#fff;color:#000;font:600 13px/1.3 system-ui;padding:6px 8px;border-radius:6px;z-index:9}
</style>
</head>
<body>
<div class="screen">
  <div class="top"><button class="back">← Title</button><div class="you"><span class="dot"></span>RED · YOU (HOST)</div></div>
  <div class="card" role="region" aria-label="Your room">
    <h1>Your room</h1>
    <div class="lab">Room code</div>
    <div class="code">K7PQ2</div>
    <div class="row"><button class="btn">Copy code</button><button class="btn">Copy invite link</button><button class="btn">Share…</button></div>
    <div class="status" aria-live="polite"><i></i>Blue joined! Press Start when you're both ready.</div>
    <div class="chips"><div class="chip"><span class="dot"></span>RED · YOU</div><div class="chip"><span class="dot blue"></span>BLUE · PARTNER</div></div>
    <div class="lab">Start at</div>
    <div class="holes"><button class="hole on">Hole 1</button><button class="hole">Hole 2</button><button class="hole">Hole 3</button><button class="hole">Hole 4</button></div>
    <div class="start"><button class="btn primary" autofocus>Start game — Blue is here!</button><button class="btn ghost">Cancel room</button></div>
  </div>
  <div class="foot">No account needed. Rooms close when empty.</div>
</div>
<div class="note" id="note"></div>
<script>document.getElementById('note').textContent=`viewport ${innerWidth}x${innerHeight} · lobby is viewport-space DOM (CSS px), scrolls; card max-width 640`;</script>
</body>
</html>
