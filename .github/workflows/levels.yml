# Runs the slow level-solver suite (src/sim/__tests__/levels-solver-w{1,2,3}.test.ts, `npm run test:levels`) so a
# physics or level change that opens a solo bypass, breaks co-op solvability, strands a launcher, loops a flight
# or traps a ball for good is gated in CI, not only by the CONTRIBUTING recipe. The suite is split per world and
# runs as a matrix, one shard per job (BUILD_DECISIONS D10.13): the heaviest shard (World 3) took 14 min alone on a
# 4-vCPU machine, and all three shards run in parallel on one such machine finished in 19 min. It is a separate
# workflow because it does not fit the 15-minute CI job, and it runs only when the sim, the levels or the solver
# itself changed (or by hand).
name: Levels

on:
  push:
    branches: [main, 'redesign/**']
    paths:
      - 'src/sim/**'
      - 'scripts/solver.ts'
      - 'scripts/solver/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/levels.yml'
  pull_request:
    paths:
      - 'src/sim/**'
      - 'scripts/solver.ts'
      - 'scripts/solver/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/levels.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levels-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  solve:
    name: level solver suite (world ${{ matrix.world }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        world: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run src/sim/__tests__/levels-solver-w${{ matrix.world }}.test.ts
